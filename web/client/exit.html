<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Clans — Thanks for playing</title>
  <style>
    @font-face { font-family: Pixelify; src: url('PixelifySans.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(#101326c9, #101326eb), url('sanctuary.webp') center / cover;
      color: #fff1cf; font-family: Pixelify, monospace; text-align: center;
    }
    main { width: min(100%, 560px); padding: 48px 24px; background: #252339f2; border: 1px solid #efc878; box-shadow: 0 10px 0 #10132680; }
    .title { margin: 0 0 8px; color: #efc878; font-size: clamp(32px, 7vw, 48px); }
    .subtitle { margin: 0 0 36px; font-size: 14px; letter-spacing: 3px; color: #acabc4; }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 32px); font-weight: normal; }
    .note { margin: 0 0 32px; color: #acabc4; font-size: 18px; }
    a { display: inline-block; padding: 12px 42px; border: 2px solid #41415e; color: #fff1cf; background: #101326; text-decoration: none; font-size: 22px; }
    a:hover, a:focus-visible { border-color: #efc878; color: #efc878; outline: none; }
  </style>
</head>
<body>
  <main>
    <p class="title">FOUR CLANS</p>
    <p class="subtitle">SHINOBI ARENA</p>
    <h1>THANKS FOR PLAYING</h1>
    <p class="note">The game is closed. You can close this tab.</p>
    <a href="./">PLAY AGAIN</a>
  </main>
</body>
</html>
